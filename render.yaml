# Free configuration. Configure Turso and Brevo first; preserve hosted data.
# Update the existing website service to preserve its URL. No paid disks.
services:
  - type: web
    name: takeaway-ordering-demo
    runtime: python
    plan: free
    numInstances: 1
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run website.py --server.address 0.0.0.0 --server.port $PORT --server.headless true --browser.gatherUsageStats false
    healthCheckPath: /_stcore/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.12
      - key: TAKEAWAY_EMBEDDED_API
        value: "1"
      - key: TAKEAWAY_TEMPORARY_DEMO
        value: "0"
      - key: TAKEAWAY_REQUIRE_REMOTE_DATABASE
        value: "1"
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
      - key: TAKEAWAY_EMAIL_ENABLED
        value: "1"
      - key: TAKEAWAY_WEBSITE_URL
        value: https://takeaway-ordering-demo.onrender.com
      - key: TAKEAWAY_ADMIN_USERNAME
        sync: false
      - key: TAKEAWAY_ADMIN_PASSWORD
        sync: false
      - key: TAKEAWAY_EMAIL_PROVIDER
        value: brevo
      - key: BREVO_API_KEY
        sync: false
      - key: TAKEAWAY_EMAIL_FROM
        sync: false
