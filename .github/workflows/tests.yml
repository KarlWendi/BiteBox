name: Python tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.14']
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run tests
        run: python -m unittest discover -v
      - name: Run queue demonstration
        run: python queue_demo.py
      - name: Test libSQL compatibility on the deployment Python version
        if: matrix.python-version == '3.12'
        env:
          TAKEAWAY_SQLITE_DRIVER: libsql
        run: python -m unittest discover -v
